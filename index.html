<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokee & Nikly 🐷 - Shared Savings & Financial Goal Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emeraldTheme: { 500: '#10b981', 600: '#059669', bg: '#f0fdf4' },
                        roseTheme: { 500: '#f43f5e', 600: '#e11d48', bg: '#fff1f2' },
                        midnightTheme: { 500: '#6366f1', 600: '#4f46e5', bg: '#eef2ff' },
                        sunsetTheme: { 500: '#f97316', 600: '#ea580c', bg: '#fff7ed' }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body id="appBody" class="bg-emerald-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 relative overflow-x-hidden">

    <!-- Ambient Background Decorations (Strictly z-0 and pointer-events-none to prevent covering totals) -->
    <div class="absolute top-0 left-0 w-full h-72 bg-gradient-to-b from-emerald-500/10 to-transparent pointer-events-none z-0"></div>

    <div class="max-w-md mx-auto p-4 sm:p-6 relative z-10">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    Tokee & Nikly <span class="text-2xl">🐷</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Shared Savings & Financial Goal Tracker</p>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Theme/Settings Button -->
                <button onclick="openSettings()" class="p-2 rounded-xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 hover:scale-105 transition">
                    ⚙️
                </button>
                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" id="darkModeBtn" class="p-2 rounded-xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 hover:scale-105 transition">
                    🌙
                </button>
            </div>
        </header>

        <!-- Total Joint Savings Card -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-xl border border-slate-100 dark:border-slate-800 mb-6 relative z-20">
            <div class="text-center">
                <span class="text-xs uppercase tracking-wider font-semibold text-slate-400 dark:text-slate-500">Total Joint Savings</span>
                <div id="totalJointSavings" class="text-4xl font-extrabold text-emerald-600 dark:text-emerald-400 my-2">৳10</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">
                    Goal Target: <span id="displayGoalTarget" class="font-semibold">৳50,000</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full my-4 overflow-hidden">
                <div id="goalProgressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
            </div>

            <!-- Individual Totals Grid -->
            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl text-center border border-slate-100 dark:border-slate-800">
                    <span class="text-xs text-slate-500 dark:text-slate-400">Tokee's Total</span>
                    <div id="tokeesTotal" class="text-xl font-bold mt-1">৳0</div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl text-center border border-slate-100 dark:border-slate-800 relative">
                    <!-- High z-index explicitly ensures clean interaction -->
                    <span class="text-xs text-slate-500 dark:text-slate-400">Nikly's Total</span>
                    <div id="niklysTotal" class="text-xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">৳10</div>
                </div>
            </div>
        </div>

        <!-- Current Month Target -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-800 mb-6 flex justify-between items-center relative z-20">
            <div>
                <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Current Month Target</span>
                <div class="text-lg font-bold mt-0.5">
                    <span id="monthlyCurrent">৳10</span> / <span id="monthlyGoalTarget">৳5,000</span>
                </div>
            </div>
            <div class="text-right">
                <div id="monthlyPercent" class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">0%</div>
                <span class="text-[10px] uppercase font-bold text-slate-400">Achieved</span>
            </div>
        </div>

        <!-- Add Savings Entry Form -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-800 mb-6 relative z-20">
            <h2 class="text-base font-bold mb-4 flex items-center gap-2">
                <span>➕</span> Add Savings Entry
            </h2>
            <form id="savingsForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Contributor</label>
                        <select id="contributor" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Nikly">Nikly</option>
                            <option value="Tokee">Tokee</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Entry Type</label>
                        <select id="entryType" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Daily Update">Daily Update</option>
                            <option value="Bonus">Bonus</option>
                            <option value="Milestone">Milestone</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Amount (৳)</label>
                        <input type="number" id="amount" required placeholder="e.g. 500" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Date</label>
                        <input type="date" id="entryDate" required class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/20 transition">
                    Save Entry
                </button>
            </form>
        </div>

        <!-- Recent Entries Feed -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-800 relative z-20">
            <h2 class="text-base font-bold mb-4 flex items-center justify-between">
                <span>Recent Entries</span>
                <span id="entryCount" class="text-xs font-normal text-slate-400">0 entries</span>
            </h2>
            <div id="entriesList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <p class="text-xs text-slate-400 text-center py-4">No entries recorded yet.</p>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 dark:border-slate-800">
            <h3 class="text-lg font-bold mb-4">Settings & Live Sync</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Overall Goal Target (৳)</label>
                    <input type="number" id="settingGoalTarget" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Monthly Goal Target (৳)</label>
                    <input type="number" id="settingMonthlyTarget" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Theme Accent</label>
                    <select id="themeSelector" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                        <option value="emerald">Fresh Emerald</option>
                        <option value="rose">Rose Gold</option>
                        <option value="midnight">Midnight Blue</option>
                        <option value="sunset">Sunset Gold</option>
                    </select>
                </div>
                <hr class="border-slate-100 dark:border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Firebase Realtime DB URL (Optional for Live Sync)</label>
                    <input type="text" id="firebaseDbUrl" placeholder="https://your-app-default-rtdb.firebaseio.com" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs">
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="closeSettings()" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Cancel</button>
                <button onclick="saveSettings()" class="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Default Local State
        let state = {
            goalTarget: 50000,
            monthlyTarget: 5000,
            theme: 'emerald',
            darkMode: false,
            firebaseUrl: '',
            entries: [
                { id: '1', contributor: 'Nikly', entryType: 'Daily Update', amount: 10, date: '2026-10-24' }
            ]
        };

        // Initialize Date Input to Today
        document.getElementById('entryDate').valueAsDate = new Date();

        function initApp() {
            const saved = localStorage.getItem('tokee_nikly_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            }
            applyState();
            render();
        }

        function applyState() {
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('darkModeBtn').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkModeBtn').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            persist();
            applyState();
        }

        function openSettings() {
            document.getElementById('settingGoalTarget').value = state.goalTarget;
            document.getElementById('settingMonthlyTarget').value = state.monthlyTarget;
            document.getElementById('themeSelector').value = state.theme;
            document.getElementById('firebaseDbUrl').value = state.firebaseUrl || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            state.goalTarget = Number(document.getElementById('settingGoalTarget').value) || 50000;
            state.monthlyTarget = Number(document.getElementById('settingMonthlyTarget').value) || 5000;
            state.theme = document.getElementById('themeSelector').value;
            state.firebaseUrl = document.getElementById('firebaseDbUrl').value.trim();
            persist();
            closeSettings();
            render();
        }

        function persist() {
            localStorage.setItem('tokee_nikly_state', JSON.stringify(state));
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const newEntry = {
                id: Date.now().toString(),
                contributor: document.getElementById('contributor').value,
                entryType: document.getElementById('entryType').value,
                amount: Number(document.getElementById('amount').value),
                date: document.getElementById('entryDate').value
            };

            state.entries.unshift(newEntry);
            document.getElementById('amount').value = '';
            persist();
            render();
        }

        function deleteEntry(id) {
            state.entries = state.entries.filter(en => en.id !== id);
            persist();
            render();
        }

        function render() {
            let totalJoint = 0;
            let tokeeTotal = 0;
            let niklyTotal = 0;
            let currentMonthTotal = 0;

            const currentMonthStr = new Date().toISOString().slice(0, 7); // YYYY-MM

            state.entries.forEach(en => {
                const amt = Number(en.amount) || 0;
                totalJoint += amt;
                if (en.contributor === 'Tokee') tokeeTotal += amt;
                if (en.contributor === 'Nikly') niklyTotal += amt;

                if (en.date && en.date.startsWith(currentMonthStr)) {
                    currentMonthTotal += amt;
                }
            });

            // Update UI elements
            document.getElementById('totalJointSavings').innerText = `৳${totalJoint.toLocaleString()}`;
            document.getElementById('displayGoalTarget').innerText = `৳${state.goalTarget.toLocaleString()}`;
            document.getElementById('tokeesTotal').innerText = `৳${tokeeTotal.toLocaleString()}`;
            document.getElementById('niklysTotal').innerText = `৳${niklyTotal.toLocaleString()}`;

            document.getElementById('monthlyCurrent').innerText = `৳${currentMonthTotal.toLocaleString()}`;
            document.getElementById('monthlyGoalTarget').innerText = `৳${state.monthlyTarget.toLocaleString()}`;

            const overallPct = Math.min(100, Math.round((totalJoint / state.goalTarget) * 100));
            document.getElementById('goalProgressBar').style.width = `${overallPct}%`;

            const monthlyPct = Math.min(100, Math.round((currentMonthTotal / state.monthlyTarget) * 100));
            document.getElementById('monthlyPercent').innerText = `${monthlyPct}%`;

            document.getElementById('entryCount').innerText = `${state.entries.length} entries`;

            // Render Feed
            const listEl = document.getElementById('entriesList');
            if (state.entries.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No entries recorded yet.</p>`;
            } else {
                listEl.innerHTML = state.entries.map(en => `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
                        <div>
                            <div class="font-bold text-sm">${en.contributor} <span class="text-xs font-normal text-slate-400">• ${en.entryType}</span></div>
                            <div class="text-[10px] text-slate-400">${en.date}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-emerald-600 dark:text-emerald-400">+৳${Number(en.amount).toLocaleString()}</span>
                            <button onclick="deleteEntry('${en.id}')" class="text-slate-400 hover:text-red-500 text-xs">✕</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        initApp();
    </script>
</body>
</html>
